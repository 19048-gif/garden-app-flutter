name: Build iOS (IPA sem assinatura)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Compilar iOS sem assinatura
        run: flutter build ios --release --no-codesign

      - name: Criar o IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r GardenApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GardenApp-ipa
          path: GardenApp.ipa
          retention-days: 14